<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; width: 250px; padding: 15px; }
    h2 { margin-top: 0; }
    .status { margin-bottom: 15px; font-weight: bold; }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .running { background-color: #4caf50; }
    .stopped { background-color: #f44336; }
    button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; cursor: pointer; }
    .queue-info { font-size: 12px; color: #666; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>NFT RADAR</h2>
  
  <div class="status">
    Status: 
    <span id="status-dot" class="status-dot stopped"></span>
    <span id="status-text">Stopped</span>
  </div>

  <button id="btn-start">Start</button>
  <button id="btn-stop">Stop</button>
  <button id="btn-settings">Settings</button>

  <div class="queue-info">
    Queue size: <span id="queue-count">0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
