<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; cursor: pointer; background: #000; color: #fff; border: none; }
    #msg { margin-top: 15px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>NFT Radar Settings</h2>
  
  <div class="form-group">
    <label for="workerUrl">Worker URL (e.g. https://worker.domain.workers.dev)</label>
    <input type="text" id="workerUrl">
  </div>
  
  <div class="form-group">
    <label for="clientKey">Client Key</label>
    <input type="password" id="clientKey">
  </div>

  <div class="form-group">
    <label for="scanInterval">Scan Interval (minutes)</label>
    <input type="number" id="scanInterval" min="1" value="10">
  </div>

  <div class="form-group">
    <label for="maxScrolls">Max Scrolls per Query</label>
    <input type="number" id="maxScrolls" min="1" value="5">
  </div>

  <div class="form-group">
    <label for="pageRefreshInterval">Hard Refresh Scanner Tab (minutes, 0 = off)</label>
    <input type="number" id="pageRefreshInterval" min="0" value="15">
  </div>

  <div class="form-group" style="border: 1px solid #ccc; padding: 15px; margin-top: 20px;">
    <h3>Moni Score Filter</h3>
    <label><input type="checkbox" id="moniFilterEnabled"> Enable Moni Score filter</label>
    
    <label style="margin-top: 10px;" for="moniFilterMinScore">Minimum Moni Score:</label>
    <input type="number" id="moniFilterMinScore" value="1000">

    <label style="margin-top: 10px;" for="minFollowers">Minimum Followers:</label>
    <input type="number" id="minFollowers" value="0">

    <label style="margin-top: 10px;" for="moniFilterIfUnavailable">If Moni Score unavailable:</label>
    <select id="moniFilterIfUnavailable" style="width: 100%; padding: 8px;">
      <option value="allow">Allow</option>
      <option value="reject">Reject</option>
    </select>
  </div>

  <button id="save">Save Settings</button>
  <div id="msg"></div>

  <script src="config.js"></script>
  <script src="settings.js"></script>
</body>
</html>
